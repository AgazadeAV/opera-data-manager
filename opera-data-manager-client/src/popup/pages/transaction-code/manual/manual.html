<button id="back-to-methods" class="back-button" type="button">
    ← Back
</button>

<div class="page-title">
    Create Transaction Code
</div>

<form id="transaction-code-form">

    <div class="field">

        <label for="code">
            Code
        </label>

        <input id="code" name="code" type="text" required>

    </div>


    <div class="field">

        <label for="description">
            Description
        </label>

        <input id="description" name="description" type="text" required>

    </div>


    <div class="field">

        <label for="subgroup">
            Subgroup
        </label>

        <input id="subgroup" name="subgroup" type="text" required>

    </div>


    <div class="field">

        <label for="transactionType">
            Transaction Type
        </label>

        <input id="transactionType" name="transactionType" type="text">

    </div>


    <div class="checkboxes">

        <label class="checkbox">

            <input id="revenueGroup" name="revenueGroup" type="checkbox">

            <span>
                Revenue Group
            </span>

        </label>


        <label class="checkbox">

            <input id="manualPosting" name="manualPosting" type="checkbox">

            <span>
                Manual Posting
            </span>

        </label>

    </div>


    <button id="create-button" type="submit">
        Create Transaction Code
    </button>

</form>
